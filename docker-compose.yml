# Docker Compose for the Telegram Giveaway Bot.
#
# Isolation notes (so this stack never clashes with other bots on the server):
#   * Container/volume/network names are prefixed by the Compose project name
#     (COMPOSE_PROJECT_NAME in .env) — no fixed container_name that could collide.
#   * Postgres and Redis are NOT published to the host by default; the bot reaches
#     them over this project's private network. Uncomment the `ports` only if you
#     really need host access, and pick a free host port via .env.
#   * Each project gets its own default network, so a "postgres"/"redis" service
#     in another stack stays completely separate.

services:
  postgres:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Меньше памяти под кэш страниц: у бота база крошечная.
    command: postgres -c shared_buffers=32MB -c work_mem=2MB
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # ports:
    #   - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 256m

  redis:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    # ports:
    #   - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    mem_limit: 128m

  bot:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      # glibc резервирует память про запас на каждый поток Python; 2 арены заметно снижают аппетит.
      MALLOC_ARENA_MAX: "2"
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      # Mount the Google service account ONLY if you use Sheets sync
      # (and set GOOGLE_CREDENTIALS_PATH=/app/service_account.json in .env):
      # - ./service_account.json:/app/service_account.json:ro
    restart: unless-stopped
    mem_limit: 400m

volumes:
  postgres_data:
  redis_data:
